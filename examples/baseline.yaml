apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: view-config
  namespace: apps
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: view-config-team
  namespace: apps
subjects:
  - kind: Group
    apiGroup: rbac.authorization.k8s.io
    name: platform-readers
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: view-config
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kube-health
rules:
  - nonResourceURLs: ["/healthz"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kube-health-bots
subjects:
  - kind: ServiceAccount
    namespace: monitoring
    name: health-bot
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kube-health
