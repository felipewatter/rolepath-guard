name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rolepath-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - name: Checkout pinned action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Python pinned action
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test dependencies
        run: python -m pip install -e '.[test]'
      - name: Compile Python sources
        run: python -m compileall -q src tests
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Dependency consistency
        run: python -m pip check
      - name: Assertions demo (clean)
        run: rolepath assert --snapshot examples/baseline.yaml --groups examples/groups.json --checks examples/invariants.json
      - name: Safe baseline scanning
        run: rolepath scan --snapshot examples/baseline.yaml --fail-on low
      - name: Risk report SARIF
        run: rolepath scan --snapshot examples/candidate.yaml --format sarif --fail-on none --output example.sarif
      - name: Validate SARIF version
        run: python -c "import json; j=json.load(open('example.sarif',encoding='utf8')); assert j['version']=='2.1.0' and j['runs'][0]['tool']['driver']['name']=='RolePath Guard'"
      - name: Build package
        run: python -m build
